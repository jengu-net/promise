jars, they answer each promise's standing as the build would have, every product's together.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","standing":"PASSING","tested":["cloud.jengu.promise.PackedResultsTest#onlyOutcomesTravel","cloud.jengu.promise.PackedResultsTest#packedResultsAnswerAsTheRunWould","cloud.jengu.promise.PackedResultsTest#twoReleasesAnswerTogether"],"enforced":[]},"REQ-PROMISE-ONE-PRODUCTS-UNREADABLE-EVIDENCE-IS-ITS-OWN":{"text":"Reading the evidence, an index or a report that cannot be read is reported by where it came from, read whole or not at all, and every other product's evidence is still answered.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","standing":"PASSING","tested":["cloud.jengu.promise.EvidenceTest#oneProductsUnreadableIndexIsReported"],"enforced":[]},"REQ-PROMISE-THE-LEDGER-IS-ONE-PAGE":{"text":"The ledger is one self-contained HTML page drawn from the composed model and, given a run, its evidence: every kind of group as a tab, each group with its description, its promises and how many are kept and passing, and nothing a catalogue holds written into the page as markup.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","standing":"PASSING","tested":["cloud.jengu.promise.BasisTest#theLedgerShowsTheBasis","cloud.jengu.promise.HtmlReportTest#aCatalogueCannotWriteMarkupIntoThePage","cloud.jengu.promise.HtmlReportTest#theLedgerCarriesTheModelAndTheRun","cloud.jengu.promise.HtmlReportTest#theSummaryLeadsWithWhatIsKept","cloud.jengu.promise.HtmlReportTest#withoutARunThereIsNoStanding"],"enforced":[]},"REQ-PROMISE-THE-BADGE-SAYS-WHAT-THE-LEDGER-SAYS":{"text":"Beside the page, the ledger draws a badge saying how much is kept and how the last run went: green when everything is kept and nothing fails, amber while promises wait for a test, red when a test citing one failed.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","standing":"PASSING","tested":["cloud.jengu.promise.HtmlReportTest#theBadgeSaysWhatTheLedgerSays"],"enforced":[]},"REQ-PROMISE-THE-PLUGIN-DRAWS-THE-LEDGER":{"text":"A module applying the Gradle plugin draws its ledger and a markdown summary from its jar, its runtime classpath and its tests' results; in a GitHub Actions job the summary is added to the job's own summary.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","assurance":"Proven by APluginPacksAModulesCitationsTest in the plugin's own module, whose jar carries those citations; a classpath holding the framework without the plugin reads this note instead.","standing":"PASSING","tested":["cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#eachModuleDrawsItsLedger","cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#theProductDrawsOneLedgerAndTheJobSeesIt"],"enforced":[]},"REQ-PROMISE-A-RELEASE-PACKS-ITS-RESULTS":{"text":"Asked for, the Gradle plugin packs a build's test results into the jar a product names, after its tests, and before it is published; a build that does not ask is unchanged, and no jar waits for its tests.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","assurance":"Proven by APluginPacksAModulesCitationsTest in the plugin's own module, whose jar carries those citations; a classpath holding the framework without the plugin reads this note instead.","standing":"PASSING","tested":["cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#aBuildThatDoesNotAskIsUnchanged","cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#aReleasePacksItsRun"],"enforced":[]},"REQ-PROMISE-APPLYING-THE-PLUGIN-IS-ALL-A-MODULE-DOES":{"text":"A module applying the Gradle plugin has its catalogues indexed, its production code's and its tests' citations indexed apart, and its tests' citations packed into its jar — waiting for the tests to compile and never for them to run — with no build code of its own; a module that does not apply it is unchanged.","status":"PROVEN","gap":false,"catalogue":"REQ-PROMISE","assurance":"Proven by APluginPacksAModulesCitationsTest in the plugin's own module, whose jar carries those citations; a classpath holding the framework without the plugin reads this note instead.","standing":"PASSING","tested":["cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#aModuleWithoutThePluginIsUnchanged","cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#theJarCarriesBothIndexes","cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest#theJarDoesNotWaitForTheTests"],"enforced":[]}},"groups":[{"kind":"feature","code":"FEAT-PROMISE-DECLARING","title":"Declaring promises: once, by name, in catalogues that compose","description":"A promise is an enum constant whose name is its code, so nothing can cite one that does not exist. Catalogues register themselves as they compile, and several products' catalogues compose into one graph, groups and areas included. What nobody can state yet is declared as a gap and counted.","promises":["REQ-PROMISE-NAME-IS-THE-CODE","REQ-PROMISE-GAP-IS-FIRST-CLASS","REQ-PROMISE-REGISTERED-AT-COMPILE-TIME","REQ-PROMISE-CATALOGUE-READ-WHOLE","REQ-PROMISE-DOWN-LINKS-ONLY","REQ-PROMISE-AREAS-MERGE-BY-CODE","REQ-PROMISE-A-PROMISE-NAMES-ITS-BASIS"]},{"kind":"feature","code":"FEAT-PROMISE-CITING","title":"Citing promises: from tests that prove them and code that enforces them","description":"A test says which promises it proves with its product's own annotation, and production code may say where it enforces one. Both are indexed as they compile, under names of their own, and travel in the module's jar. Only a test's citation proves.","promises":["REQ-PROMISE-CITATION-IS-TYPED","REQ-PROMISE-PROOFS-INDEXED-AT-COMPILE-TIME","REQ-PROMISE-TESTS-CITATIONS-TRAVEL-APART","REQ-PROMISE-ONLY-A-TEST-PROVES"]},{"kind":"feature","code":"FEAT-PROMISE-READING","title":"Reading the graph and the evidence behind it","description":"From a classpath, the composed graph: every promise's status, every group's coverage, and with a run's JUnit results each promise's standing. One product's unreadable evidence is reported and never takes another's down. The same reading draws the markdown report and the HTML ledger.","promises":["REQ-PROMISE-STATUS-IS-DERIVED","REQ-PROMISE-COVERAGE-IS-A-FOLD","REQ-PROMISE-STANDING-IS-READ-FROM-THE-RUN","REQ-PROMISE-STANDING-FOLLOWS-THE-BASIS","REQ-PROMISE-A-RUN-IS-PACKED-FAITHFULLY","REQ-PROMISE-ONE-PRODUCTS-UNREADABLE-EVIDENCE-IS-ITS-OWN","REQ-PROMISE-THE-LEDGER-IS-ONE-PAGE","REQ-PROMISE-THE-BADGE-SAYS-WHAT-THE-LEDGER-SAYS"]},{"kind":"feature","code":"FEAT-PROMISE-BUILDING","title":"Wiring a product's build","description":"One Gradle plugin is all a module applies: it indexes the module's catalogues and citations, packs the tests' citations into its jar, and draws the ledger of what the module promises and what its last run proved.","promises":["REQ-PROMISE-APPLYING-THE-PLUGIN-IS-ALL-A-MODULE-DOES","REQ-PROMISE-THE-PLUGIN-DRAWS-THE-LEDGER","REQ-PROMISE-A-RELEASE-PACKS-ITS-RESULTS"]}],"areas":[],"results":{"cloud.jengu.promise.BasisTest":{"tests":5,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.CatalogueProcessorTest":{"tests":3,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.CitationIndexTest":{"tests":2,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.CodeAndGapTest":{"tests":4,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.EvidenceTest":{"tests":5,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.HtmlReportTest":{"tests":5,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.ModelTest":{"tests":5,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.PackedResultsTest":{"tests":3,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.StatusAndCoverageTest":{"tests":3,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.TheToolsetKeepsItsPromisesTest":{"tests":3,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.TwoIndexesTest":{"tests":5,"failures":0,"errors":0,"skipped":0},"cloud.jengu.promise.gradle.APluginPacksAModulesCitationsTest":{"tests":9,"failures":0,"errors":0,"skipped":0}},"runs":[],"unreadable":[]}</script>
<script>
(() => {
  const model = JSON.parse(document.getElementById('model').textContent);
  if (model.title) document.getElementById('eyebrow').textContent = model.title;
  const STATUSES = ['PROVEN', 'ASSURED', 'BASED', 'PLANNED', 'GAP'];
  const STANDINGS = ['PASSING', 'FAILING', 'NO_RESULT', 'UNCITED'];
  const RUN = { PASSING: 'Passing', FAILING: 'Failing', NO_RESULT: 'No result', UNCITED: 'Uncited' };
  const hasRun = Object.values(model.promises).some(p => p.standing);
  const results = model.results || {};
  const LABEL = { PROVEN: 'Proven', ASSURED: 'Assured', BASED: 'By basis', PLANNED: 'Planned', GAP: 'Unknown' };
  const KINDS = [
    { id: 'stories', kind: 'story', name: 'Stories', type: 'Story',
      intro: 'What somebody does, and what the system holds up while they do it.' },
    { id: 'features', kind: 'feature', name: 'Features', type: 'Feature',
      intro: 'What the product does, each as the promises that make it true.' },
    { id: 'qualities', kind: 'quality', name: 'Qualities', type: 'Quality',
      intro: 'How well it does it: properties that hold across everything.' },
    { id: 'constraints', kind: 'constraint', name: 'Constraints', type: 'Constraint',
      intro: 'What it must obey: regulation and policy, clause by clause.' },
    { id: 'areas', kind: 'area', name: 'Areas', type: 'Area',
      intro: 'Concerns that span stories, features, qualities and constraints, folded together.' },
  ];

  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid);
    return node;
  };

  const promiseOf = code => model.promises[code];
  const fold = codes => {
    const c = { PROVEN: 0, ASSURED: 0, BASED: 0, PLANNED: 0, GAP: 0 };
    for (const code of codes) { const p = promiseOf(code); if (p) c[p.status]++; }
    return c;
  };
  const total = c => STATUSES.reduce((n, s) => n + (c[s] || 0), 0);
  const kept = c => (c.PROVEN || 0) + (c.ASSURED || 0) + (c.BASED || 0);
  const pct = c => total(c) ? Math.round(1000 * kept(c) / total(c)) / 10 : 0;
  const bar = (c, cls = 'bar') => el('div', { class: cls, role: 'img',
      'aria-label': `${kept(c)} of ${total(c)} kept` },
    STATUSES.filter(s => c[s]).map(s => el('i', { class: 's-' + s,
      style: `width:${100 * c[s] / total(c)}%`, title: `${LABEL[s]}: ${c[s]}` })));

  const groupsByKind = kind => kind === 'area' ? model.areas : model.groups.filter(g => g.kind === kind);
  const groupByCode = Object.fromEntries(model.groups.map(g => [g.code, g]));
  const areaCodes = area => [...new Set(area.covers.flatMap(c => groupByCode[c] ? groupByCode[c].promises : []))];
  const codesOf = (g, kind) => kind === 'area' ? areaCodes(g) : g.promises;

  // ── summary ────────────────────────────────────────
  const all = Object.keys(model.promises);
  const overall = fold(all);
  document.getElementById('rate').append(`${pct(overall)}%`, el('small', { text: 'kept' }));
  document.getElementById('rate-bar').replaceWith(bar(overall, 'bar thick'));
  document.getElementById('rate-caption').textContent =
    `${kept(overall)} of ${total(overall)} promises proven by a test, assured by a recorded reason, or kept by the promises they are based on.`;
  const standingOf = codes => {
    const c = { PASSING: 0, FAILING: 0, NO_RESULT: 0, UNCITED: 0 };
    for (const code of codes) { const p = promiseOf(code); if (p && p.standing) c[p.standing]++; }
    return c;
  };
  if (hasRun) {
    const run = standingOf(all);
    const line = document.getElementById('runline');
    line.append(el('span', {}, 'Last run: ', el('b', { text: run.PASSING }), ' passing'));
    for (const s of ['FAILING', 'NO_RESULT', 'UNCITED']) {
      line.append(el('span', { class: 'run' }, el('i', { class: 'r-' + s }), `${run[s]} ${RUN[s].toLowerCase()}`));
    }
    line.append(el('span', { text: `${Object.keys(results).length} test classes reported` }));
  }
  if ((model.unreadable || []).length) {
    const box = document.getElementById('unreadable');
    box.hidden = false;
    box.append(el('strong', { text: `${model.unreadable.length} source${model.unreadable.length > 1 ? 's' : ''} could not be read, so this page may be missing what they hold:` }));
    for (const u of model.unreadable) box.append(el('div', {}, el('code', { text: u.source }), ' — ', u.reason));
  }
  const tiles = document.getElementById('tiles');
  for (const s of STATUSES) {
    tiles.append(el('div', { class: 'tile' }, el('b', { text: overall[s] }),
      el('span', {}, el('i', { class: 'legend-dot s-' + s }), LABEL[s])));
  }
  const catalogues = {};
  for (const p of Object.values(model.promises)) if (!p.gap) catalogues[p.catalogue] = (catalogues[p.catalogue] || 0) + 1;
  const products = document.getElementById('products');
  products.append('Composed from');
  for (const [ns, n] of Object.entries(catalogues).sort((a, b) => b[1] - a[1])) {
    products.append(el('span', { class: 'chip', title: `${n} promises` }, ns, el('span', { text: n, style: 'color:var(--faint)' })));
  }

  // ── tabs ───────────────────────────────────────────
  const tabs = document.getElementById('tabs');
  for (const k of KINDS) {
    const groups = groupsByKind(k.kind);
    const c = fold([...new Set(groups.flatMap(g => codesOf(g, k.kind)))]);
    tabs.append(el('button', { class: 'tab' + (groups.length ? '' : ' is-empty'), role: 'tab', id: 'tab-' + k.id, 'aria-controls': 'panel',
        'aria-selected': 'false', onclick: () => show(k.id) },
      el('span', { class: 'name' }, k.name, el('span', { class: 'count', text: groups.length })),
      bar(c)));
  }

  // ── state ──────────────────────────────────────────
  const state = { tab: null, query: '', statuses: new Set(STATUSES), sort: 'catalogue', open: new Set() };
  const search = document.getElementById('search');
  const sort = document.getElementById('sort');
  search.addEventListener('input', () => { state.query = search.value.trim().toLowerCase(); render(); });
  sort.addEventListener('change', () => { state.sort = sort.value; render(); });
  const filters = document.getElementById('filters');
  for (const s of STATUSES) {
    const b = el('button', { class: 'filter', 'aria-pressed': 'true', onclick: () => {
      state.statuses.has(s) ? state.statuses.delete(s) : state.statuses.add(s);
      if (!state.statuses.size) STATUSES.forEach(x => state.statuses.add(x));
      [...filters.children].forEach((f, i) => f.setAttribute('aria-pressed', state.statuses.has(STATUSES[i])));
      render();
    } }, el('i', { class: 'legend-dot s-' + s }), LABEL[s]);
    filters.append(b);
  }

  const matches = code => {
    const p = promiseOf(code);
    if (!p || !state.statuses.has(p.status)) return false;
    if (!state.query) return true;
    return [code, p.text, ...(p.tested || []), ...(p.enforced || [])].some(t => t.toLowerCase().includes(state.query));
  };

  // ── groups ─────────────────────────────────────────
  const shortSite = (site, tested) => {
    const [cls, member] = site.split('#');
    const simple = cls.slice(cls.lastIndexOf('.') + 1);
    let verdict = null;
    if (tested && hasRun) {
      const r = results[cls];
      verdict = !r || !r.tests ? el('span', { class: 'none', text: '  — did not run' })
        : r.failures + r.errors ? el('span', { class: 'bad', text: `  ✗ ${r.failures + r.errors} of ${r.tests} failed` })
        : r.skipped ? el('span', { class: 'none', text: `  ${r.skipped} of ${r.tests} skipped` })
        : el('span', { class: 'ok', text: `  ✓ class passed, ${r.tests} test${r.tests > 1 ? 's' : ''}` });
    }
    return el('span', { title: site }, el('span', { class: 'cls', text: cls.slice(0, cls.length - simple.length) }),
      simple, member ? '#' + member : '', verdict);
  };

  const promiseRow = code => {
    const p = promiseOf(code);
    const li = el('li', { class: 'promise' },
      el('span', { class: 'pill p-' + p.status, text: LABEL[p.status] }),
      el('div', { class: 'text' + (p.gap ? ' gap' : ''), text: p.text }));
    const meta = el('div', { class: 'meta' }, el('span', { class: 'code', text: p.gap ? code + ' · nobody has stated this yet' : code }));
    if (p.standing) meta.append(el('span', { class: 'run', title: 'In the last run' }, el('i', { class: 'r-' + p.standing }), RUN[p.standing]));
    const sites = (p.tested || []).length + (p.enforced || []).length;
    let box = null;
    if (sites) {
      const label = [(p.tested || []).length ? `${p.tested.length} test${p.tested.length > 1 ? 's' : ''}` : null,
        (p.enforced || []).length ? `${p.enforced.length} enforcing` : null].filter(Boolean).join(' · ');
      const toggle = el('button', { class: 'cite-toggle', 'aria-expanded': 'false', text: label + ' ▸', onclick: () => {
        box.hidden = !box.hidden;
        toggle.setAttribute('aria-expanded', !box.hidden);
        toggle.textContent = label + (box.hidden ? ' ▸' : ' ▾');
      } });
      meta.append(toggle);
      box = el('div', { class: 'sites', hidden: true },
        (p.tested || []).length ? [el('div', { class: 'kind', text: 'Proven by' }), p.tested.map(t => shortSite(t, true))] : [],
        (p.enforced || []).length ? [el('div', { class: 'kind', text: 'Enforced in' }), p.enforced.map(t => shortSite(t, false))] : []);
    }
    li.append(meta);
    if (box) li.append(box);
    if ((p.basis || []).length) {
      li.append(el('ul', { class: 'basis' },
        el('li', { class: 'label', text: 'Based on' }),
        p.basis.map(code => {
          const g = promiseOf(code);
          if (!g) return el('li', {}, el('span', {}), el('span', { class: 'ground', text: code }));
          return el('li', {},
            el('span', { class: 'pill p-' + g.status, text: LABEL[g.status] }),
            el('span', { class: 'ground' },
              el('span', { class: 'code', text: code }),
              g.text,
              g.standing ? el('span', { class: 'run', style: 'margin-left:8px' },
                el('i', { class: 'r-' + g.standing }), RUN[g.standing]) : null));
        })));
    }
    if (p.assurance) li.append(el('div', { class: 'note', text: p.assurance }));
    return li;
  };

  const groupCard = (g, kind) => {
    const codes = codesOf(g, kind);
    const c = fold(codes);
    const shown = codes.filter(matches);
    const isOpen = state.open.has(g.code) || (state.query && shown.length);
    const card = el('section', { class: 'group', id: g.code, open: isOpen });
    const n = total(c);
    const head = el('button', { class: 'group-head', 'aria-expanded': String(!!isOpen), onclick: () => {
        state.open.has(g.code) ? state.open.delete(g.code) : state.open.add(g.code);
        render();
      } },
      el('div', { class: 'group-title' },
        el('div', { class: 'codeline' }, el('span', { class: 'caret', text: '▶' }), el('span', { class: 'chip', text: g.code })),
        el('h3', { text: g.title }),
        g.description ? el('p', { text: g.description }) : null),
      el('div', { class: 'group-rate' },
        el('div', { class: 'nums' },
          kept(c) === n ? el('span', { class: 'done', text: 'All kept' }) : el('span', { text: `${pct(c)}% kept` }),
          el('span', {}, el('b', { text: kept(c) }), ` / ${n}`)),
        bar(c),
        hasRun ? (() => { const r = standingOf(codes);
          return r.FAILING ? el('span', { class: 'run' }, el('i', { class: 'r-FAILING' }), `${r.FAILING} failing in the last run`)
            : el('span', { class: 'run' }, el('i', { class: 'r-' + (r.PASSING === n ? 'PASSING' : 'NO_RESULT') }),
                `${r.PASSING} of ${n} passing in the last run`); })() : null));
    card.append(head);
    const body = el('div', { class: 'group-body', hidden: !isOpen });
    if (kind === 'area') {
      body.append(el('div', { class: 'covers' }, g.covers.map(code => {
        const inner = groupByCode[code];
        if (!inner) return null;
        const ic = fold(inner.promises);
        const target = KINDS.find(k => k.kind === inner.kind);
        return el('button', { class: 'cover', onclick: () => { state.open.add(code); show(target.id, code); } },
          el('span', { class: 'kindtag', text: inner.kind }),
          el('span', { class: 'title', text: inner.title }),
          el('span', { class: 'mini' }, `${kept(ic)} / ${total(ic)}`, bar(ic)));
      })));
    } else {
      body.append(shown.length ? el('ul', { class: 'promises' }, shown.map(promiseRow))
        : el('div', { class: 'empty', text: 'No promise here matches the search or the status filter.' }));
    }
    card.append(body);
    return card;
  };

  const sample = k => k.kind === 'area'
    ? `@Catalogue(namespace = "AREA-SHOP")
public enum ShopAreas implements Area {
    PAYMENTS("Taking and returning money", List.of(ShopFeatures.CHECKOUT, ShopFeatures.REFUNDS));
    // title() and covers() return what the constructor was given
}`
    : `@Catalogue(namespace = "${{ story: 'US', feature: 'FEAT', quality: 'QUAL', constraint: 'CON' }[k.kind]}-SHOP")
public enum Shop${k.name} implements ${k.type} {
    CHECKOUT("Somebody buys what is in their basket", List.of(
            ShopPromises.ORDER_TOTAL_IS_THE_SUM_OF_ITS_LINES,
            Promise.gap("what happens when the payment provider times out")));
    // title() and promises() return what the constructor was given
}`;

  function render() {
    const k = KINDS.find(x => x.id === state.tab);
    document.getElementById('tab-intro').textContent = k.intro;
    document.querySelector('.toolbar').hidden = !groupsByKind(k.kind).length;
    if (!groupsByKind(k.kind).length) {
      document.getElementById('groups').replaceChildren(el('div', { class: 'empty' },
        el('div', { class: 'declare' },
          el('strong', { text: `No ${k.name.toLowerCase()} declared yet` }),
          el('span', { text: `A ${k.type} groups promises under one title, and reads as kept when every promise in it is. Declare one in a catalogue of its own:` }),
          el('pre', { text: sample(k) }))));
      return;
    }
    let groups = groupsByKind(k.kind).map((g, i) => ({ g, i, c: fold(codesOf(g, k.kind)) }));
    if (state.query || state.statuses.size < STATUSES.length) {
      groups = groups.filter(({ g }) => codesOf(g, k.kind).some(matches)
        || (state.query && (g.title + ' ' + g.code).toLowerCase().includes(state.query)));
    }
    if (state.sort === 'weakest') groups.sort((a, b) => pct(a.c) - pct(b.c) || total(b.c) - total(a.c));
    if (state.sort === 'largest') groups.sort((a, b) => total(b.c) - total(a.c) || a.i - b.i);
    const list = document.getElementById('groups');
    list.replaceChildren(...(groups.length ? groups.map(({ g }) => groupCard(g, k.kind))
      : [el('div', { class: 'empty', text: 'Nothing here matches the search or the status filter.' })]));
  }

  function show(id, focus) {
    if (!KINDS.some(k => k.id === id)) id = (KINDS.find(k => groupsByKind(k.kind).length) || KINDS[0]).id;
    state.tab = id;
    for (const t of tabs.children) t.setAttribute('aria-selected', String(t.id === 'tab-' + id));
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* framed */ }
    render();
    if (focus) {
      const card = document.getElementById(focus);
      if (card) {
        card.scrollIntoView({ block: 'start', behavior: 'smooth' });
        card.classList.add('flash');
        setTimeout(() => card.classList.remove('flash'), 1400);
      }
    }
  }

  const foot = document.getElementById('foot');
  foot.append(el('span', { text: `Generated ${new Date(model.generated).toLocaleString()}` }),
    el('span', { text: `${model.groups.length} groups · ${model.areas.length} areas · ${all.length} promises` }),
    ...((model.runs || []).length ? [el('span', { text: `Results packed by ${model.runs.join(', ')}` })] : []),
    el('span', { text: 'Kept = proven by a citing test, assured by a recorded reason, or kept by its basis.' }));

  show((location.hash || '').slice(1) || (KINDS.find(k => groupsByKind(k.kind).length) || KINDS[0]).id);
})();
</script>
</body>
</html>
